variable_paths:
  method: method.name
  rank: method.rank
  max_length: data.max_length
  micro_batch_size: training.micro_batch_size
  seed: training.seed
  learning_rate: training.learning_rate

sweeps:
  smoke:
    run_name: "smoke_{method}"
    matrix:
      - {method: full_ft, rank: null, learning_rate: 0.00002}
      - {method: lora, rank: 16, learning_rate: 0.0002}
    overrides:
      training:
        effective_batch_size: 2
        max_steps: 30
        training_token_budget: null
      evaluation:
        max_examples: 32

  main:
    run_name: "main_{method}"
    matrix:
      - {method: full_ft, rank: null, learning_rate: 0.00002}
      - {method: lora, rank: 16, learning_rate: 0.0002}

  max_batch:
    run_name: "batch_{method}_mb{micro_batch_size}"
    matrix:
      - {method: full_ft, rank: null, learning_rate: 0.00002}
      - {method: lora, rank: 16, learning_rate: 0.0002}
    axes:
      micro_batch_size: [1, 2, 4, 8, 16]

  rank:
    run_name: "rank_lora_r{rank}"
    matrix:
      - {method: lora, rank: 4, learning_rate: 0.0002}
      - {method: lora, rank: 8, learning_rate: 0.0002}
      - {method: lora, rank: 16, learning_rate: 0.0002}
      - {method: lora, rank: 32, learning_rate: 0.0002}

  sequence_length:
    run_name: "seq_{method}_l{max_length}"
    matrix:
      - {method: full_ft, rank: null, learning_rate: 0.00002}
      - {method: lora, rank: 16, learning_rate: 0.0002}
    axes:
      max_length: [256, 512, 1024]

  hyperparameter_tuning:
    # Common learning-rate grid for both methods over the three selection
    # seeds, scored on the held-out validation split so the official test
    # split stays untouched by tuning.
    run_name: "hyperparameter_tuning_{method}_lr{lr_tag}_s{seed}"
    matrix:
      - {method: full_ft, rank: null, learning_rate: 0.00002, lr_tag: "2e-5"}
      - {method: full_ft, rank: null, learning_rate: 0.00005, lr_tag: "5e-5"}
      - {method: full_ft, rank: null, learning_rate: 0.0001, lr_tag: "1e-4"}
      - {method: full_ft, rank: null, learning_rate: 0.0002, lr_tag: "2e-4"}
      - {method: lora, rank: 16, learning_rate: 0.00002, lr_tag: "2e-5"}
      - {method: lora, rank: 16, learning_rate: 0.00005, lr_tag: "5e-5"}
      - {method: lora, rank: 16, learning_rate: 0.0001, lr_tag: "1e-4"}
      - {method: lora, rank: 16, learning_rate: 0.0002, lr_tag: "2e-4"}
    axes:
      seed: [11, 22, 33]
    overrides:
      evaluation:
        split: validation
        max_examples: 500
      output:
        save_final_checkpoint: false

  final_seeds:
    run_name: "seed_{method}_r{rank}_s{seed}"
    matrix:
      - {method: full_ft, rank: 0, learning_rate: 0.00002}
      - {method: lora, rank: 8, learning_rate: 0.0002}
      - {method: lora, rank: 16, learning_rate: 0.0002}
    axes:
      seed: [11, 22, 33, 44, 55]
